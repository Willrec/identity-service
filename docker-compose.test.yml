name: identity-service-test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: elevo_test_db
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d elevo_test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
